name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Check npm package contents
        run: npm run pack:check

      - name: Smoke test npx executable
        run: |
          npm pack --pack-destination /tmp
          npx -y --package /tmp/roberttlange-headless-*.tgz headless --help

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Headless CLI
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python SDK
        run: python -m pip install -e "./python[test]"

      - name: Lint and type check
        working-directory: python
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy src tests

      - name: Test Python SDK
        working-directory: python
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=80

      - name: Build Python package
        working-directory: python
        run: python -m build --outdir "${{ runner.temp }}/python-dist"

      - name: Smoke test Python SDK against local CLI
        env:
          HEADLESS_CLI_BIN: ${{ github.workspace }}/dist/cli.js
        run: python -c "from headless_cli import Headless; print(Headless().version())"
