[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "headless-cli"
version = "0.1.0"
description = "Typed Python interface for the Headless CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Robert Lange", email = "robertlange0@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/RobertTLange/headless-cli/tree/main/python"
Issues = "https://github.com/RobertTLange/headless-cli/issues"
Repository = "https://github.com/RobertTLange/headless-cli"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/headless_cli"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["headless_cli"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py310"
